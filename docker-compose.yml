services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env with RUNLOCALLY first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - orderflow
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=orderflow;Username=orderflow;Password=${POSTGRES_PASSWORD:?Create .env with RUNLOCALLY first}
      Jwt__Issuer: OrderFlow
      Jwt__Audience: OrderFlow.Client
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Create .env with RUNLOCALLY first}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${ORDERFLOW_API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 4s
      retries: 15
      start_period: 20s
    networks:
      - orderflow
networks:
  orderflow:
    driver: bridge
volumes:
  postgres-data:
